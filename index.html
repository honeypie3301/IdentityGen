<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IdentityGen — Offline Test Identity Instrument</title>
    <meta
      name="description"
      content="A completely offline web application that generates random first names, last names, Gmail addresses, and passwords with instant copy and batch export."
    />
    <meta property="og:title" content="IdentityGen — Offline Test Identity Instrument" />
    <meta
      property="og:description"
      content="A completely offline web application that generates random first names, last names, Gmail addresses, and passwords with instant copy and batch export."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('identitygen-chassis-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F2F2F0] text-[#161615] antialiased selection:bg-[#FF4D00] selection:text-white dark:bg-[#141413] dark:text-[#F2F2F0]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
